server:
  port: 8084

spring:
  application:
    name: ORDER-SERVICE
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shopping?currentSchema=order_service}
    username: ${SPRING_DATASOURCE_USERNAME:shopping}
    password: ${SPRING_DATASOURCE_PASSWORD:shopping}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis

security:
  internal-service-token: ${INTERNAL_SERVICE_TOKEN:local-order-service-token-change-me}

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    instance-id: ${EUREKA_INSTANCE_ID:${spring.application.name}:${server.port}}
    prefer-ip-address: false
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  order:
    item-lookup-executor:
      core-pool-size: ${ORDER_ITEM_LOOKUP_CORE_POOL_SIZE:8}
      max-pool-size: ${ORDER_ITEM_LOOKUP_MAX_POOL_SIZE:32}
      queue-capacity: ${ORDER_ITEM_LOOKUP_QUEUE_CAPACITY:200}
      keep-alive-seconds: ${ORDER_ITEM_LOOKUP_KEEP_ALIVE_SECONDS:60}
