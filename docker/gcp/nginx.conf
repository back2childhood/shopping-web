# This listener is published only on VM loopback; Caddy supplies the original
# scheme. Direct SSH-tunnel requests without that header retain their scheme.
map $http_x_forwarded_proto $original_scheme {
    default $scheme;
    http http;
    https https;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    location /api/ {
        set $gateway http://api-gateway:8080;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $original_scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        # Never automatically replay checkout/payment writes.
        proxy_next_upstream off;
    }

    location / {
        set $frontend http://frontend:3000;
        proxy_pass $frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $original_scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 30s;
    }
}
