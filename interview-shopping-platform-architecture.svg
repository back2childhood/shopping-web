<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">Production-scale shopping platform architecture</title>
  <desc id="desc">Layered architecture showing clients, API Gateway, synchronous Java microservices, PostgreSQL sources of truth, Redis cache, Kafka event backbone, Cassandra projections, and asynchronous consumers.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-sync" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-event" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-data" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .layer { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.3px; fill: #64748b; }
      .node-title { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; text-anchor: middle; }
      .node-text { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; text-anchor: middle; }
      .metric { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e3a8a; text-anchor: middle; }
      .edge-label { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; text-anchor: middle; }
      .sync { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow-sync); }
      .event { fill: none; stroke: #7c3aed; stroke-width: 3; stroke-dasharray: 8 7; marker-end: url(#arrow-event); }
      .data { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow-data); }
      .node { stroke-width: 1.5; filter: url(#shadow); }
    </style>
  </defs>

  <rect width="1600" height="1080" fill="#f8fafc"/>
  <text x="60" y="55" class="title">Production-Scale Shopping Platform</text>
  <text x="60" y="84" class="subtitle">Interview view: synchronous decision path, authoritative data, asynchronous event path, and failure boundaries</text>
  <rect x="1120" y="32" width="420" height="54" rx="27" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="1330" y="65" class="metric">1M DAU  ·  200 average QPS  ·  1,000 peak target</text>

  <text x="36" y="148" class="layer">CLIENT</text>
  <rect x="610" y="112" width="380" height="68" rx="13" fill="#ffffff" stroke="#cbd5e1" class="node"/>
  <text x="800" y="140" class="node-title">Web / Mobile Clients</text>
  <text x="800" y="163" class="node-text">Buyer and seller applications</text>

  <text x="36" y="258" class="layer">EDGE</text>
  <rect x="235" y="218" width="245" height="74" rx="13" fill="#eff6ff" stroke="#60a5fa" class="node"/>
  <text x="357" y="247" class="node-title">CDN / Load Balancer</text>
  <text x="357" y="271" class="node-text">TLS, static assets, traffic entry</text>

  <rect x="610" y="205" width="380" height="100" rx="13" fill="#dbeafe" stroke="#2563eb" class="node"/>
  <text x="800" y="235" class="node-title">API Gateway · WebFlux</text>
  <text x="800" y="261" class="node-text">JWT · routing · rate limit · load balancing</text>
  <text x="800" y="283" class="node-text">Per-service Circuit Breaker · HTTP 503 fallback</text>

  <rect x="1120" y="218" width="245" height="74" rx="13" fill="#f1f5f9" stroke="#94a3b8" class="node"/>
  <text x="1242" y="247" class="node-title">Eureka</text>
  <text x="1242" y="271" class="node-text">Service registry and instances</text>

  <path d="M800 180 L800 195 L357 195 L357 218" class="sync"/>
  <path d="M480 255 L610 255" class="sync"/>
  <path d="M990 255 L1120 255" class="sync"/>
  <text x="1055" y="244" class="edge-label">registry lookup</text>

  <text x="36" y="365" class="layer">CORE SERVICES</text>
  <path d="M800 305 L800 345 L170 345 L170 374" class="sync"/>
  <path d="M800 345 L420 345 L420 374" class="sync"/>
  <path d="M800 345 L670 345 L670 374" class="sync"/>
  <path d="M800 345 L920 345 L920 374" class="sync"/>
  <path d="M800 345 L1170 345 L1170 374" class="sync"/>
  <path d="M800 345 L1420 345 L1420 374" class="sync"/>
  <text x="800" y="336" class="edge-label">REST routing</text>

  <g>
    <rect x="65" y="374" width="210" height="86" rx="12" fill="#ffffff" stroke="#60a5fa" class="node"/>
    <text x="170" y="407" class="node-title">Auth</text>
    <text x="170" y="431" class="node-text">Credentials · JWT</text>
    <text x="170" y="450" class="node-text">BCrypt verification</text>
  </g>
  <g>
    <rect x="315" y="374" width="210" height="86" rx="12" fill="#ffffff" stroke="#60a5fa" class="node"/>
    <text x="420" y="407" class="node-title">Account</text>
    <text x="420" y="431" class="node-text">Global user ID</text>
    <text x="420" y="450" class="node-text">Buyer / seller profile</text>
  </g>
  <g>
    <rect x="565" y="374" width="210" height="86" rx="12" fill="#ffffff" stroke="#60a5fa" class="node"/>
    <text x="670" y="407" class="node-title">Item / Inventory</text>
    <text x="670" y="431" class="node-text">Seller catalog</text>
    <text x="670" y="450" class="node-text">Atomic stock reservation</text>
  </g>
  <g>
    <rect x="815" y="374" width="210" height="86" rx="12" fill="#ffffff" stroke="#60a5fa" class="node"/>
    <text x="920" y="407" class="node-title">Cart</text>
    <text x="920" y="431" class="node-text">Buyer selections</text>
    <text x="920" y="450" class="node-text">Short-lived state</text>
  </g>
  <g>
    <rect x="1065" y="374" width="210" height="86" rx="12" fill="#ffffff" stroke="#60a5fa" class="node"/>
    <text x="1170" y="407" class="node-title">Order</text>
    <text x="1170" y="431" class="node-text">State machine · Saga</text>
    <text x="1170" y="450" class="node-text">Idempotent checkout</text>
  </g>
  <g>
    <rect x="1315" y="374" width="210" height="86" rx="12" fill="#ffffff" stroke="#60a5fa" class="node"/>
    <text x="1420" y="407" class="node-title">Payment</text>
    <text x="1420" y="431" class="node-text">Authorize · capture</text>
    <text x="1420" y="450" class="node-text">Refund · reconciliation</text>
  </g>

  <path d="M275 417 L315 417" class="sync"/>
  <text x="295" y="405" class="edge-label">Feign</text>
  <path d="M1065 407 C950 325, 790 325, 710 374" class="sync"/>
  <text x="885" y="350" class="edge-label">batch reserve</text>
  <path d="M1275 417 L1315 417" class="sync"/>
  <text x="1295" y="405" class="edge-label">keyed call</text>

  <text x="36" y="505" class="layer">DATA OWNERSHIP</text>
  <g>
    <rect x="95" y="520" width="350" height="92" rx="12" fill="#ecfdf5" stroke="#16a34a" class="node"/>
    <text x="270" y="551" class="node-title">PostgreSQL · Identity</text>
    <text x="270" y="576" class="node-text">account_service + auth_service schemas</text>
    <text x="270" y="598" class="node-text">ACID source of truth</text>
  </g>
  <g>
    <rect x="500" y="520" width="340" height="92" rx="12" fill="#ecfdf5" stroke="#16a34a" class="node"/>
    <text x="670" y="551" class="node-title">PostgreSQL · Product</text>
    <text x="670" y="576" class="node-text">Item · Inventory · Outbox</text>
    <text x="670" y="598" class="node-text">Atomic stock truth</text>
  </g>
  <g>
    <rect x="875" y="520" width="220" height="92" rx="12" fill="#fff7ed" stroke="#f97316" class="node"/>
    <text x="985" y="551" class="node-title">Redis</text>
    <text x="985" y="576" class="node-text">Cache · idempotency</text>
    <text x="985" y="598" class="node-text">Never stock truth</text>
  </g>
  <g>
    <rect x="1135" y="520" width="365" height="92" rx="12" fill="#ecfdf5" stroke="#16a34a" class="node"/>
    <text x="1317" y="551" class="node-title">PostgreSQL · Commerce</text>
    <text x="1317" y="576" class="node-text">Orders · Payments · Outbox</text>
    <text x="1317" y="598" class="node-text">Durable workflow state</text>
  </g>

  <path d="M170 460 L170 520" class="data"/>
  <path d="M420 460 L420 485 L370 520" class="data"/>
  <path d="M670 460 L670 520" class="data"/>
  <path d="M920 460 L970 520" class="data"/>
  <path d="M1170 460 L1170 490 L1225 520" class="data"/>
  <path d="M1420 460 L1420 520" class="data"/>

  <text x="36" y="655" class="layer">EVENT BACKBONE</text>
  <rect x="470" y="668" width="660" height="100" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" class="node"/>
  <text x="800" y="704" class="node-title">Apache Kafka</text>
  <text x="800" y="731" class="node-text">itemId · orderId · paymentId · userId · conversationId as ordering keys</text>
  <text x="800" y="754" class="node-text">56 logical partitions · replication factor 3 · at-least-once + idempotent effects</text>

  <path d="M670 612 L670 668" class="event"/>
  <path d="M1260 612 L1010 668" class="event"/>
  <text x="603" y="644" class="edge-label">transactional outbox</text>
  <text x="1160" y="644" class="edge-label">order/payment events</text>

  <text x="36" y="820" class="layer">ASYNC READ MODELS &amp; CONSUMERS</text>
  <path d="M800 768 L800 805 L172 805 L172 836" class="event"/>
  <path d="M800 805 L486 805 L486 836" class="event"/>
  <path d="M800 805 L800 836" class="event"/>
  <path d="M800 805 L1114 805 L1114 836" class="event"/>
  <path d="M800 805 L1428 805 L1428 836" class="event"/>
  <text x="800" y="796" class="edge-label">independent consumer groups</text>

  <g>
    <rect x="55" y="836" width="234" height="100" rx="12" fill="#fff7ed" stroke="#ea580c" class="node"/>
    <text x="172" y="869" class="node-title">Cassandra</text>
    <text x="172" y="894" class="node-text">items_by_id</text>
    <text x="172" y="916" class="node-text">Seller/category buckets</text>
  </g>
  <g>
    <rect x="369" y="836" width="234" height="100" rx="12" fill="#ffffff" stroke="#7c3aed" class="node"/>
    <text x="486" y="869" class="node-title">Search</text>
    <text x="486" y="894" class="node-text">Product indexing</text>
    <text x="486" y="916" class="node-text">Query-specific ranking</text>
  </g>
  <g>
    <rect x="683" y="836" width="234" height="100" rx="12" fill="#ffffff" stroke="#7c3aed" class="node"/>
    <text x="800" y="869" class="node-title">Notification</text>
    <text x="800" y="894" class="node-text">Email · SMS · Push</text>
    <text x="800" y="916" class="node-text">Retry and delivery log</text>
  </g>
  <g>
    <rect x="997" y="836" width="234" height="100" rx="12" fill="#ffffff" stroke="#7c3aed" class="node"/>
    <text x="1114" y="869" class="node-title">Messaging</text>
    <text x="1114" y="894" class="node-text">Conversation ordering</text>
    <text x="1114" y="916" class="node-text">Delivery · moderation</text>
  </g>
  <g>
    <rect x="1311" y="836" width="234" height="100" rx="12" fill="#ffffff" stroke="#7c3aed" class="node"/>
    <text x="1428" y="869" class="node-title">Analytics / Ranking</text>
    <text x="1428" y="894" class="node-text">Business metrics</text>
    <text x="1428" y="916" class="node-text">Recommendation features</text>
  </g>

  <path d="M289 886 C340 886, 340 965, 410 965 L950 965 L950 612" class="data"/>
  <text x="640" y="982" class="edge-label">projection reads can populate Redis cache</text>

  <rect x="60" y="995" width="1480" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <line x1="105" y1="1021" x2="160" y2="1021" class="sync"/>
  <text x="245" y="1026" class="edge-label">synchronous REST / OpenFeign</text>
  <line x1="515" y1="1021" x2="570" y2="1021" class="event"/>
  <text x="682" y="1026" class="edge-label">asynchronous Kafka event</text>
  <line x1="920" y1="1021" x2="975" y2="1021" class="data"/>
  <text x="1077" y="1026" class="edge-label">persistence / cache access</text>
  <text x="1390" y="1026" class="edge-label">PostgreSQL decides · projections accelerate</text>
</svg>
